<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>



.wrapper {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 240px);

    grid-template-areas:
        "imagen1 imagen2 imagen3"
        "imagen4 imagen2 imagen5"
        "imagen6 imagen6 imagen7";

    gap: 5px;
    width: 100%;
    padding: 5px;
    box-sizing: border-box;
    background: #a5b5d5;
}



.wrapper-2 {
    display: grid;
    grid-template-columns: 3fr 3fr 3fr 2fr 2fr;

    grid-template-rows: repeat(3, clamp(180px, 20vw, 260px));

    grid-template-areas:
        "imagen1 imagen1 imagen1 imagen2 imagen3"
        "imagen1 imagen1 imagen1 imagen4 imagen4"
        "imagen5 imagen6 imagen7 imagen4 imagen4";

    grid-gap: 10px;
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    background: #a5b5d5;
}



.wrapper .item-1 {
    grid-area: imagen1;
}

.wrapper .item-2 {
    grid-area: imagen2;
}

.wrapper .item-3 {
    grid-area: imagen3;
}

.wrapper .item-4 {
    grid-area: imagen4;
}

.wrapper .item-5 {
    grid-area: imagen5;
}

.wrapper .item-6 {
    grid-area: imagen6;
}

.wrapper .item-7 {
    grid-area: imagen7;
}



.wrapper-2 .items-1 {
    grid-area: imagen1;
}

.wrapper-2 .items-2 {
    grid-area: imagen2;
}

.wrapper-2 .items-3 {
    grid-area: imagen3;
}

.wrapper-2 .items-4 {
    grid-area: imagen4;
}

.wrapper-2 .items-5 {
    grid-area: imagen5;
}

.wrapper-2 .items-6 {
    grid-area: imagen6;
}

.wrapper-2 .items-7 {
    grid-area: imagen7;
}



.wrapper div,
.wrapper-2 div {
    overflow: hidden;
    border: 4px solid white;
    border-radius: 13px;
    min-width: 0;
    min-height: 0;
}



.wrapper img,
.wrapper-2 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}




@media (max-width: 600px) {


    .wrapper {
        grid-template-columns: repeat(2, 1fr);

        grid-template-rows: repeat(5, clamp(140px, 42vw, 190px));

        grid-template-areas:
            "imagen1 imagen2"
            "imagen3 imagen2"
            "imagen4 imagen5"
            "imagen6 imagen6"
            "imagen7 imagen7";
    }




    .wrapper-2 {
        grid-template-columns: repeat(2, 1fr);

        grid-template-rows: repeat(6, clamp(140px, 42vw, 190px));

        grid-template-areas:
            "imagen1 imagen1"
            "imagen1 imagen1"
            "imagen2 imagen3"
            "imagen4 imagen4"
            "imagen5 imagen6"
            "imagen7 imagen7";
    }

}

</style>
</head>
