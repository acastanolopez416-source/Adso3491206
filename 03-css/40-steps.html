<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-streps</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        :root {
            --size: 256px;
        }
        body {
            overflow: hidden;
        }

        section {
            div.bg {
                background: url(imgs/bg-steps.png) no-repeat center / cover;
                border-radius: 12px;
                outline: 4px solid white;
                corner-shape: squircle;
                position: relative;
                height: 540px;

                div.info {
                    background-color: rgba(0, 0, 0, 0.644);
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    font-size: 1.6rem;
                    text-align: center;
                    position: absolute;
                    top: 0.8rem;
                    left: 0.8rem;
                    padding: 0.4rem;
                    width: 340px;
                }

                div#trainer {
                    background: url(imgs/steps-all.png) no-repeat;
                    position: absolute;
                    bottom: 0;
                    left: 4rem;
                    transform: scale(.8);
                    height: var(--size);
                    width: var(--size);

                    animation: anim 0.6s steps(4) infinite;

                    &.front {
                        background-position-y: 0;
                    }

                    &.left {
                        background-position-y: calc(var(--size) * -1);
                    }

                    &.right {
                        background-position-y: calc(var(--size) * -2);
                    }

                    &.back {
                        background-position-y: calc(var(--size) * -3);
                    }
                }
            }
        }

        @keyframes anim {
            100% {
                background-position-x: calc(var(--size) * -4);
            }
        }
</style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>40-streps</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example: </h2>
            <div class="bg">
                <div class="info">
                    precione las teclas <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div id="trainer" class="front"></div>
            </div>
        </section>
    </main>
    <script>
        const trainer = document.getElementById('trainer');
        document.addEventListener('keyup', function(e) {
            //console.log(e.keycode);
            switch (e.keyCode) {
                case 37:
                    trainer.className = '';
                    trainer.classList.add('left');
                    break;
                case 38:
                    trainer.className = '';
                    trainer.classList.add('back');
                    break;
                case 39:
                    trainer.className = '';
                    trainer.classList.add('right');
                    break;
                case 40: 
                    trainer.className = '';
                    trainer.classList.add('front');
                    break;
            }
        })
    </script>
</body>
